# Deploys the live World Championship service: sensei evals and guess the move.

service: chess-dojo-wc-live

plugins:
  - serverless-plugin-custom-roles
  - serverless-esbuild

package:
  individually: true

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  logRetentionInDays: 14
  environment:
    stage: ${sls:stage}
  httpApi:
    id: ${param:httpApiId}
  deploymentMethod: direct

functions:
  evals:
    handler: read.evals
    events:
      - httpApi:
          path: /public/wc-live/rounds/{roundId}/evals
          method: get
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:UpdateItem
        Resource: !GetAtt WcLiveTable.Arn

  listGames:
    handler: customGames.list
    events:
      - httpApi:
          path: /public/wc-live/games
          method: get
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource: !GetAtt WcLiveTable.Arn

  addGame:
    handler: customGames.add
    timeout: 15
    events:
      - httpApi:
          path: /wc-live/games
          method: post
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:PutItem
        Resource: !GetAtt WcLiveTable.Arn

  removeGame:
    handler: customGames.remove
    events:
      - httpApi:
          path: /wc-live/games/remove
          method: put
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:UpdateItem
        Resource: !GetAtt WcLiveTable.Arn

  guessStats:
    handler: stats.handler
    events:
      - httpApi:
          path: /wc-live/rounds/{roundId}/stats
          method: get
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: !GetAtt WcLiveTable.Arn
      - Effect: Allow
        Action:
          - dynamodb:GetItem
        Resource: ${param:UsersTableArn}

  getAnalysis:
    handler: analysis.get
    events:
      - httpApi:
          path: /wc-live/rounds/{roundId}/analysis
          method: get
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:Query
        Resource: !GetAtt WcLiveTable.Arn

  putAnalysis:
    handler: analysis.put
    events:
      - httpApi:
          path: /wc-live/analysis
          method: put
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:Query
          - dynamodb:UpdateItem
        Resource: !GetAtt WcLiveTable.Arn

  roster:
    handler: roster.handler
    events:
      - httpApi:
          path: /wc-live/roster
          method: put
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:PutItem
        Resource: !GetAtt WcLiveTable.Arn

  leaderboard:
    handler: read.leaderboard
    timeout: 20
    events:
      - httpApi:
          path: /public/wc-live/rounds/{roundId}/leaderboard
          method: get
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:UpdateItem
        Resource: !GetAtt WcLiveTable.Arn

  myGuesses:
    handler: read.myGuesses
    events:
      - httpApi:
          path: /wc-live/rounds/{roundId}/guesses
          method: get
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:Query
        Resource: !GetAtt WcLiveTable.Arn

  guess:
    handler: guess.handler
    events:
      - httpApi:
          path: /wc-live/guess
          method: put
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:UpdateItem
          # The guess log entry for the admin stats.
          - dynamodb:PutItem
          - dynamodb:Query
          - dynamodb:GetItem
        Resource: !GetAtt WcLiveTable.Arn
      - Effect: Allow
        Action:
          - dynamodb:GetItem
        Resource: ${param:UsersTableArn}

  eval:
    handler: eval.handler
    events:
      - httpApi:
          path: /wc-live/eval
          method: put
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:Query
          - dynamodb:UpdateItem
        Resource: !GetAtt WcLiveTable.Arn

  # Guest links: senseis copy a link per guest; the guest routes are public and
  # check the link's token in the body.
  listInvites:
    handler: invites.list
    events:
      - httpApi:
          path: /wc-live/invites
          method: get
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:PutItem
        Resource: !GetAtt WcLiveTable.Arn

  resetInvite:
    handler: invites.reset
    events:
      - httpApi:
          path: /wc-live/invites
          method: put
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:PutItem
        Resource: !GetAtt WcLiveTable.Arn

  guestMe:
    handler: guestAccess.me
    events:
      - httpApi:
          path: /public/wc-live/guest/me
          method: post
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
        Resource: !GetAtt WcLiveTable.Arn

  guestEval:
    handler: guestAccess.putEval
    events:
      - httpApi:
          path: /public/wc-live/guest/eval
          method: put
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
        Resource: !GetAtt WcLiveTable.Arn

  guestGetAnalysis:
    handler: guestAccess.getAnalysisForGuest
    events:
      - httpApi:
          path: /public/wc-live/guest/analysis/read
          method: post
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: !GetAtt WcLiveTable.Arn

  guestPutAnalysis:
    handler: guestAccess.putAnalysis
    events:
      - httpApi:
          path: /public/wc-live/guest/analysis
          method: put
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
        Resource: !GetAtt WcLiveTable.Arn

resources:
  Conditions:
    IsProd: !Equals ['${sls:stage}', 'prod']

  Resources:
    WcLiveTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${sls:stage}-wc-live
        AttributeDefinitions:
          - AttributeName: hash
            AttributeType: S
          - AttributeName: range
            AttributeType: S
        KeySchema:
          - AttributeName: hash
            KeyType: HASH
          - AttributeName: range
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: !If
            - IsProd
            - true
            - false

  Outputs:
    WcLiveTableArn:
      Value: !GetAtt WcLiveTable.Arn
