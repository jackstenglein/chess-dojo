# Deploys the Dojo Tactics Forger backend: each player's saved progress
# (frontend/public/static/tactics-forger) and the Tactics Forger leaderboard.

service: chess-dojo-tactics-trainer

plugins:
  - serverless-plugin-custom-roles
  - serverless-esbuild

package:
  individually: true

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  logRetentionInDays: 14
  environment:
    stage: ${sls:stage}
  httpApi:
    id: ${param:httpApiId}
  deploymentMethod: direct

functions:
  getProgress:
    handler: progress.getHandler
    events:
      - httpApi:
          path: /tactics-trainer/progress
          method: get
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
        Resource: !GetAtt TacticsTrainerProgressTable.Arn

  saveProgress:
    handler: progress.saveHandler
    timeout: 15
    events:
      - httpApi:
          path: /tactics-trainer/progress
          method: put
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource: !GetAtt TacticsTrainerProgressTable.Arn
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource: !GetAtt TacticsTrainerLeaderboardTable.Arn
      - Effect: Allow
        Action:
          - dynamodb:GetItem
        Resource: ${param:UsersTableArn}

  getLeaderboard:
    handler: leaderboard.getHandler
    timeout: 15
    events:
      - httpApi:
          path: /tactics-trainer/leaderboard
          method: get
          authorizer:
            type: jwt
            id: ${param:apiAuthorizer}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Scan
        Resource: !GetAtt TacticsTrainerLeaderboardTable.Arn

resources:
  Conditions:
    IsProd: !Equals ['${sls:stage}', 'prod']

  Resources:
    TacticsTrainerProgressTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${sls:stage}-tactics-trainer-progress
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: !If
            - IsProd
            - true
            - false
        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: username
            KeyType: HASH

    TacticsTrainerLeaderboardTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${sls:stage}-tactics-trainer-leaderboard
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: !If
            - IsProd
            - true
            - false
        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: username
            KeyType: HASH
