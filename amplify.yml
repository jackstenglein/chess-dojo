version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - echo 'Pre build'
            - pwd
            - corepack enable
            - node --version
            - pnpm --version
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pwd
            - pnpm build:$AMPLIFY_ENV
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .pnpm-store/**/*
