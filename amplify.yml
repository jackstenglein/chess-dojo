version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - echo 'Pre build'
            - pwd
            - corepack enable
            - node --version
            - pnpm --version
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pwd
            # Server-side code only sees the Amplify variables written to .env.production.
            - if [ -n "$LICHESS_API_TOKEN" ]; then printf '\nLICHESS_API_TOKEN=%s\n' "$LICHESS_API_TOKEN" >> .env.production; fi
            - pnpm build:$AMPLIFY_ENV
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .pnpm-store/**/*
